name: Infrastructure verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout aws-iac compatibility declaration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: usekarma/aws-iac
          path: aws-iac
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check aws-iac contract compatibility
        run: |
          if [[ -f aws-iac/contracts/aws-config-compatibility.json ]]; then
            python scripts/validate_contract_compatibility.py --aws-config-dir . --aws-iac-dir aws-iac
          else
            echo "aws-iac compatibility declaration not yet published; bootstrap declaration pending."
          fi
      - name: Install hash-locked verification tools
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Choose verification base
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-${PUSH_BASE:-origin/main}}"
          if [[ "$base" =~ ^0+$ ]]; then base=origin/main; fi
          echo "VERIFY_BASE_REF=$base" >> "$GITHUB_ENV"
      - name: Run non-destructive gates
        run: make verify
